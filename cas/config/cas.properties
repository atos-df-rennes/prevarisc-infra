# Configuration minimale du serveur CAS Apereo pour les tests dev Prévarisc.
# Le serveur CAS est exposé en HTTP (pas HTTPS) sur le port 8083 de l'hôte.
#
# Pré-requis DB : créer l'utilisateur testcas dans MySQL avant de tester :
#   INSERT INTO UTILISATEUR (LOGIN, PASSWORD, ACTIF, SSO, PROFIL_ID) VALUES
#     ('testcas', '', 1, 1, 1);

# URL publique du serveur CAS (accessible depuis le navigateur).
# La communication conteneur→CAS utilise host.docker.internal dans httpd-auth-worktree.conf ou httpd-auth-main.conf.
cas.server.name=http://localhost:8083
cas.server.prefix=${cas.server.name}/cas

# Désactiver HTTPS pour le dev
server.ssl.enabled=false
server.port=8080

# Sécurité cookie (pas de HTTPS en dev)
cas.tgc.secure=false
cas.warningCookie.secure=false
# SameSite=Lax : requis sur HTTP (None nécessite Secure=true)
cas.tgc.sameSitePolicy=Lax

# Authentification statique (dev uniquement, ne jamais utiliser en production)
cas.authn.accept.enabled=true
cas.authn.accept.users=testcas::Prevarisc2024

# Service registry JSON : autorise les services enregistrés dans /etc/cas/config/services/
cas.service-registry.core.init-from-json=true
cas.service-registry.json.location=file:/etc/cas/config/services

# Logs
logging.level.org.apereo.cas=WARN
