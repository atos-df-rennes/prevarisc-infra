services:
  app:
    build:
      args:
        user: prv
        uid: 1000
      dockerfile: php/prevarisc/Dockerfile
    restart: unless-stopped
    volumes:
      - ./php/prevarisc/php.ini:/usr/local/etc/php/php.ini
      - ./apache/apache.conf:/etc/apache2/sites-available/000-default.conf
      - ./apache/httpd-prevarisc-version.conf:/etc/apache2/httpd-prevarisc-version.conf
      - ./apache/httpd-prevarisc-config.conf:/etc/apache2/httpd-prevarisc-config.conf
      - ./apache/httpd-auth-main.conf:/etc/apache2/httpd-auth-main.conf:ro
      - ./prevarisc-migration:/var/www/html/prevarisc-migration
      # Passerelle Plat'AU montée pour que Prevarisc puisse faire un healthcheck.
      # Lorsque le code sera rapatrié dans l'application, ce montage ne sera plus nécessaire.
      - ./prevarisc-passerelle-platau:/var/www/html/prevarisc-passerelle-platau
    post_start:
      - command: chmod 775 /var/www/html/prevarisc-migration/public
      - command: bash -c 'mkdir -p /var/www/html/prevarisc-migration/public/data/uploads/{commission,dossier,etablissement,etablissement_miniature} && chown prv:prv /var/www/html/prevarisc-migration/public/data/uploads/*'
      - command: bash -c 'mkdir -p /var/www/html/prevarisc-migration/public/data/uploads/documents/{1,2,3,4} && chown prv:prv /var/www/html/prevarisc-migration/public/data/uploads/documents/*'
      - command: chmod -R 775 /var/www/html/prevarisc-migration/public/data
    ports:
      - target: 80
        published: 7080
        protocol: tcp
    extra_hosts:
      - host.docker.internal:host-gateway

  # Passerelle Plat'AU dans un conteneur car version de PHP différente.
  # Lorsque le code sera rapatrié dans l'application, ce conteneur ne sera plus nécessaire.
  platau:
    build:
      args:
        user: prv
        uid: 1000
      dockerfile: php/prevarisc-passerelle-platau/Dockerfile
    restart: unless-stopped
    volumes:
      - ./prevarisc-passerelle-platau:/var/www/html/prevarisc-passerelle-platau
      - ./php/prevarisc-passerelle-platau/php.ini:/usr/local/etc/php/php.ini
      - ./prevarisc-migration:/var/www/html/prevarisc-migration

  db:
    image: mysql:5.6.51
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - target: 3306
        published: 33061
        protocol: tcp
    environment:
      MYSQL_ROOT_PASSWORD: planmusique
      MYSQL_DATABASE: PRV_prevarisc_v2
      MYSQL_USER: prevarisc
      MYSQL_PASSWORD: planmusique

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - target: 8025
        published: 8025
        protocol: tcp
      - target: 1025
        published: 1025
        protocol: tcp
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Proxy HTTP sortant pour tester PREVARISC_PROXY_ENABLED en local.
  # Accessible depuis les conteneurs app/platau via http://tinyproxy:8888
  tinyproxy:
    image: monokal/tinyproxy:latest
    command: ANY
    restart: unless-stopped
    ports:
      - target: 8888
        published: 8888
        protocol: tcp

volumes:
  db_data:
