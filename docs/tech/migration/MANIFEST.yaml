      - calendrier_des_commissions_dialog_edit
      - calendrier_des_commissions_alertsuppression
      - calendrier_des_commissions_validsuppression
    notes: >
      Phase A migrée (7 actions affichage calendrier) : index, commissionselection,
      dialogcomm (mega-switch), alertsuppression, validsuppression.
      JS séparé dans public/js/calendrier-commissions.js.
      Corrections post-migration (pipeline complet) :
      - Ajout cas newComm dans dialogComm (manquant → "Erreur mauvais choix")
      - Format ISO 8601 pour dateD/dateF (start.toISOString())
      - Suppression eval() + renderEvent legacy → refetchEvents + result.success
      - Ajout btn-default sur bouton Fermer
      - Suppression float:left sur <ul> Bootstrap 3 (layout cassé)
      - show_footer conditionnel sur form_date.html.twig (évite doublon boutons)
      - Validation @Assert\Callback sur CommissionDatesDto (dateFin si withPeriodicite)
      Les fonctionnalités suivantes sont encore TODO :
      - Gestion ODJ (drop, resize, affectation dossiers)
      - Génération documents (convocations, ODJ, PV, comptes rendus)
      - Export Outlook (route exportoutlookmois référencée dans JS → '#' temporaire)
      Tâche prioritaire car très utilisée en production.

