# Migration manifest — Zend 1.12 → Symfony 4.4
# Source de vérité pour le suivi de la migration.
#
# RÈGLE : Mettre à jour ce fichier dans le même commit que la migration.
#
# Statuts :
#   done    → Entièrement migré, validé PHPStan + CS + tests
#   partial → Partiellement migré (certaines actions manquantes)
#   todo    → Pas encore commencé
#   skip    → Hors scope (volontairement non migré)
#
# Complexité :
#   low    → Port mécanique, peu de logique métier
#   medium → Logique métier modérée, quelques cas edge
#   high   → Logique complexe, beaucoup de dépendances, génération de docs, etc.
#
# Entités : Doctrine entities concernées (pour analyse de parallélisation)
#   Deux tâches sont parallélisables si elles n'ont pas d'entités en commun.

version: 1

