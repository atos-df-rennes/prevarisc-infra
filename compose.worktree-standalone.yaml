# Stack Docker isolée pour tester un worktree en parallèle de la stack principale.
# Utilise un project name séparé ("worktree") pour un namespace de conteneurs indépendant.
#
# Usage via Castor (recommandé) :
#   castor worktree:start
#   castor worktree:stop
#
# Usage manuel :
#   PREVARISC_DIR=prevarisc-worktree-<feature> \
#   PREVARISC_MIGRATION_DIR=prevarisc-migration-worktree-<feature> \
#   docker compose --project-name worktree -f compose.worktree-standalone.yaml up -d

services:
  app:
    build:
      args:
        user: prv
        uid: 1000
      dockerfile: php/prevarisc/Dockerfile
    restart: unless-stopped
    volumes:
      - ./php/prevarisc/php.ini:/usr/local/etc/php/php.ini
      - ./apache/apache.conf:/etc/apache2/sites-available/000-default.conf
      - ./apache/httpd-prevarisc-version.conf:/etc/apache2/httpd-prevarisc-version.conf
      - ./apache/httpd-prevarisc-config.conf:/etc/apache2/httpd-prevarisc-config.conf
      - ./${PREVARISC_MIGRATION_DIR:-prevarisc-migration}:/var/www/html/prevarisc-migration
      - ./prevarisc-passerelle-platau:/var/www/html/prevarisc-passerelle-platau
      - ./apache/httpd-auth-worktree.conf:/etc/apache2/httpd-auth-worktree.conf:ro
    post_start:
      - command: chmod 775 /var/www/html/prevarisc-migration/public
      - command: bash -c 'mkdir -p /var/www/html/prevarisc-migration/public/data/uploads/{commission,dossier,etablissement,etablissement_miniature} && chown prv:prv /var/www/html/prevarisc-migration/public/data/uploads/*'
      - command: bash -c 'mkdir -p /var/www/html/prevarisc-migration/public/data/uploads/documents/{1,2,3,4} && chown prv:prv /var/www/html/prevarisc-migration/public/data/uploads/documents/*'
      - command: chmod -R 775 /var/www/html/prevarisc-migration/public/data
    ports:
      - target: 80
        published: 7081
        protocol: tcp
    extra_hosts:
      - host.docker.internal:host-gateway

  db:
    image: mariadb:11.8
    volumes:
      - db_data_worktree:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - target: 3306
        published: 33062
        protocol: tcp
    environment:
      MYSQL_ROOT_PASSWORD: planmusique
      MYSQL_DATABASE: PRV_prevarisc_v2
      MYSQL_USER: prevarisc
      MYSQL_PASSWORD: planmusique

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - target: 8025
        published: 8026
        protocol: tcp
      - target: 1025
        published: 1026
        protocol: tcp
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db_data_worktree:
