# Authentification LDAP pour tests dev Prévarisc.
#
# Inclus automatiquement via IncludeOptional httpd-auth-*.conf dans apache.conf.
# NE PAS monter simultanément avec httpd-auth-cas.conf ou httpd-auth-ntlm-test.conf.
#
# Pré-requis DB (utilisateur SSO=0 car authentification par mot de passe LDAP) :
#   INSERT INTO UTILISATEUR (LOGIN, PASSWORD, ACTIF, SSO, PROFIL_ID)
#     VALUES ('testldap', '', 1, 0, 1);
#
# Identifiants de test : testldap / Prevarisc2024 (définis dans ldap/bootstrap.ldif)

SetEnv PREVARISC_LDAP_ENABLED 1
SetEnv PREVARISC_LDAP_HOST "ldap"
SetEnv PREVARISC_LDAP_PORT "389"
SetEnv PREVARISC_LDAP_USERNAME "cn=admin,dc=prevarisc,dc=local"
SetEnv PREVARISC_LDAP_PASSWORD "planmusique"
SetEnv PREVARISC_LDAP_BASEDN "ou=users,dc=prevarisc,dc=local"
