# Authentification CAS pour tests dev Prévarisc.
#
# Inclus automatiquement via IncludeOptional httpd-auth-*.conf dans apache.conf.
# NE PAS monter simultanément avec httpd-auth-ldap.conf ou httpd-auth-ntlm-test.conf.
#
# Pré-requis DB (utilisateur SSO=1 car authentification déléguée au CAS) :
#   INSERT INTO UTILISATEUR (LOGIN, PASSWORD, ACTIF, SSO, PROFIL_ID)
#     VALUES ('testcas', '', 1, 1, 1);
#
# Identifiant de test : testcas / Prevarisc2024 (défini dans cas/config/cas.properties)
# Le serveur CAS est accessible depuis le navigateur ET le conteneur app via host.docker.internal:8083.

SetEnv PREVARISC_CAS_ENABLED 1
SetEnv PREVARISC_CAS_HOST "host.docker.internal"
SetEnv PREVARISC_CAS_PORT "8083"
SetEnv PREVARISC_CAS_PUBLIC_HOST "localhost"
SetEnv PREVARISC_CAS_PUBLIC_PORT "8083"
SetEnv PREVARISC_CAS_CONTEXT "cas"
SetEnv PREVARISC_CAS_NO_SERVER_VALIDATION "1"
SetEnv PREVARISC_CAS_NO_SSL "1"
SetEnv PREVARISC_CAS_VERSION "2.0"
