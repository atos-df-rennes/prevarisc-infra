# Simulation NTLM pour tests dev Prévarisc — DEV UNIQUEMENT.
#
# Ce fichier est inclus via IncludeOptional dans apache.conf.
# Il n'est monté que dans compose.worktree-auth.yaml (non présent dans compose.dev.yaml).
#
# Pré-requis DB : créer l'utilisateur testntlm dans MySQL avant de tester :
#   INSERT INTO UTILISATEUR (LOGIN, PASSWORD, ACTIF, SSO, PROFIL_ID) VALUES
#     ('testntlm', '', 1, 1, 1);
#
# En production, REMOTE_USER est positionné par mod_auth_ntlm_winbind + Kerberos/Samba.
# Ici on le simule directement via SetEnv pour valider l'intégration Symfony.

SetEnv PREVARISC_NTLM_ENABLED 1
SetEnv REMOTE_USER "testntlm"
