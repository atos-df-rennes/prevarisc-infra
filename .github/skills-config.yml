# Skills configuration — deterministic invocation and run_context defaults

# Global default run context for skills
default_run_context: main

# Per-skill configuration
skills:
  migrate-feature:
    default_run_context: main
    supports_worktree: true
    notes: "Orchestration skill: suggests tasks, checklists and outputs. To perform repo changes, prefer invoking the agent 'symfony-migration' or set run_context: worktree."

  analyse-legacy:
    default_run_context: main
    supports_worktree: false
    notes: "Read-only analysis skill. It does not change repository state."

  worktree-task:
    default_run_context: worktree
    supports_worktree: true
    opt_in_required: true
    notes: "This skill operates inside a worktree and must be explicitly requested (run_context: worktree). It will NOT be invoked automatically by other skills unless explicitly asked."

  symfony-migration:
    default_run_context: main
    supports_worktree: true
    notes: "Agent that may perform code changes. Default runs in main; to run in a worktree set run_context: worktree."

# Policy summary
policy: |
  Skills are orchestration-only and deterministic. They will not alter repository state by themselves. Use agents or explicit slash commands for actions that change files, branches, or push commits.
  Set run_context to 'worktree' to opt-in to worktree operations.
