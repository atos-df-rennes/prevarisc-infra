# Historique de traitement des écarts de migration
# Ce fichier trace le statut et l'historique des corrections/validations d'écarts
# Format: chaque entrée représente un écart traité avec ses métadonnées

ecarts:
  # Template: copier ce bloc pour chaque écart traité
  # MOD-XX:
  #   - number: <numéro écart>
  #     title: <titre écart>
  #     action: <fix|check> # fix = correction, check = vérification
  #     status: <closed|open|blocked> # closed = terminé, open = en cours/ouvert, blocked = bloqué
  #     date_processed: <YYYY-MM-DD>
  #     validated_by: <user|system> # qui a validé la correction/vérification
  #     notes: <notes additionnelles>
  #     files_modified: # fichiers modifiés lors de la correction
  #       - <path>
  #     commit_refs: # références aux commits de correction (optionnel)
  #       - <commit-sha>

