# Surcharge Docker Compose pour l'environnement Copilot agent.
# Usage : docker compose --file compose.dev.yaml --file compose.agent.yaml up -d
#
# Supprime les hooks post_start de l'app (introduits en Docker Compose 2.30,
# potentiellement absents du runner GitHub Actions) et les remplace par une
# étape de setup dédiée dans copilot-setup-steps.yml.

services:
  app:
    post_start: []
