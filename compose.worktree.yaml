# Override compose pour tester un worktree sans impacter le travail principal.
#
# Usage :
#   PREVARISC_DIR=prevarisc-worktree-<feature> \
#   PREVARISC_MIGRATION_DIR=prevarisc-migration-worktree-<feature> \
#   docker compose -f compose.dev.yaml -f compose.worktree.yaml up -d --no-deps app
#
# Retour au dépôt principal :
#   docker compose -f compose.dev.yaml up -d --no-deps app

services:
  app:
    volumes:
      - ./${PREVARISC_DIR:-prevarisc}:/var/www/html/prevarisc
      - ./${PREVARISC_MIGRATION_DIR:-prevarisc-migration}:/var/www/html/prevarisc-migration

  platau:
    volumes:
      - ./${PREVARISC_DIR:-prevarisc}:/var/www/html/prevarisc
      - ./${PREVARISC_MIGRATION_DIR:-prevarisc-migration}:/var/www/html/prevarisc-migration
